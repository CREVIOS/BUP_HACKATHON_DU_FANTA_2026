apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "fuelops.labels" "web" | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels:
        {{- include "fuelops.labels" "web" | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ .Values.web.repository }}:{{ .Values.web.tag }}
          # Next.js standalone server: frontend/Dockerfile sets PORT=3000.
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
          # Only what the /ai routes need (same as compose), never the backend's fuelops-env (DB, JWT).
          env:
            - { name: API_PROXY_TARGET, value: "http://api:8000" }
          # OPENAI_API_KEY (+ optional LLM_MODEL, OPENAI_BASE_URL): kubectl create secret generic fuelops-web ...
          # Optional: without it the assistant answers with its built-in mock model.
          envFrom: [{ secretRef: { name: fuelops-web, optional: true } }]
---
apiVersion: v1
kind: Service
metadata:
  name: web
  annotations: { alb.ingress.kubernetes.io/healthcheck-path: / }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fuelops
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.order: "100"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.ingress.hostname | quote }}
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
