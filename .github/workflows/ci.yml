name: ci
# PRs run this directly; pushes to main run it via deploy.yml (workflow_call) before releasing.
on: { pull_request: {}, workflow_call: {}, workflow_dispatch: {} }
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build --build-arg VERSION=${GITHUB_SHA::7} -t fuelops-backend:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.6.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.5 }
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly && terraform -chdir=infra validate
      - run: terraform -chdir=infra test
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - run: python3 scripts/check_bootstrap_charts.py
