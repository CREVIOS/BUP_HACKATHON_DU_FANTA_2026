{{- range $i := list
  (dict "name" "argocd" "ns" "argocd" "path" "/" "svc" "argocd-server" "port" 80 "health" "/healthz" "order" "10" "class" "alb-ops")
  (dict "name" "grafana" "ns" "monitoring" "path" "/grafana" "svc" "kps-grafana" "port" 80 "health" "/grafana/api/health" "order" "20")
  (dict "name" "rollouts" "ns" "argo-rollouts" "path" "/rollouts" "svc" "argo-rollouts-dashboard" "port" 3100 "health" "/rollouts/" "order" "30")
}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $i.name }}
  namespace: {{ $i.ns }}
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.order: {{ $i.order | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ $i.health }}
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  ingressClassName: {{ $i.class | default "alb" }}
  rules:
    - http:
        paths:
          - path: {{ $i.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $i.svc }}
                port:
                  number: {{ $i.port }}
{{- end }}
