# CI rewrites the two image tags below on every main build (GitOps); Argo CD syncs them.
# Placeholder tags deliberately fail chart schema validation. For local lint/render,
# supply full SHA tags; enable_application stays false until CI commits real releases.
ingress:
  # Must be covered by the Terraform-managed ALB's existing ACM certificates.
  hostname: fuelops.hemal.me
image:
  repository: 373220260649.dkr.ecr.ap-southeast-1.amazonaws.com/fuelops
  tag: 6630d39697722d447c152642c1b8748af88fb9cd
web:
  repository: 373220260649.dkr.ecr.ap-southeast-1.amazonaws.com/fuelops-web
  tag: 6630d39697722d447c152642c1b8748af88fb9cd
  replicas: 2
simulator:
  image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
  speed: "1" # ticks/s; default 8 outruns the pipeline (docs/INFRA_DECISIONS.md §3)
  tickMinutes: "15"
  startMode: paused # demo is step-driven via /admin/step
api:
  replicas: 4
  hpa: {min: 4, max: 10, cpu: 60}
  env: {} # e.g. CHAOS_500_PCT: "5" to demo an alarm rollback
intel:
  replicas: 2
  env: {}
ingestor:
  env: {}
# Service name verified against the pinned kube-prometheus-stack chart in infra/.
prometheusURL: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
# OpenTelemetry: backend pods export OTLP to the in-namespace collector, which sends
# traces to Grafana Tempo (monitoring ns) and re-exposes OTel metrics for Prometheus.
# Set endpoint to "" to remove OTel env vars and the app Collector on the next sync.
# Terraform-managed Tempo, Loki, node log collection, and Grafana datasources remain.
otel:
  endpoint: http://otel-collector.fuelops.svc:4317
  environment: prod
  image: otel/opentelemetry-collector-contrib:0.161.0
  tempoEndpoint: tempo.monitoring.svc:4317
rollback:
  maxErrorRate: 0.02 # canary 5xx ratio that aborts the rollout
  maxP95Seconds: 0.8
  smokeRequests: 60
  smokeMaxFailures: 1
