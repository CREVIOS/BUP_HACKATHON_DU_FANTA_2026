# Local stack — what judges run: `docker compose up --build`
# Frontend service is added by the frontend track (frontend/Dockerfile, nginx: / -> SPA, /api -> api:8080).
name: fuelops

x-backend: &backend
  build:
    context: ./backend
    args: { VERSION: "${VERSION:-dev}" }
  image: fuelops-backend:local
  restart: unless-stopped
  env_file: [{ path: .env, required: false }]   # TYPESAFE_API_KEY (optional; rules fallback without it)
  environment: &backend-env
    DATABASE_URL: postgres://fuelops:fuelops@postgres:5432/fuelops?sslmode=disable
    INTEL_URL: http://intel:8082

services:
  simulator:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    platform: linux/amd64                       # image is amd64-only (emulated on Apple Silicon)
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports: ["8000:8000"]                        # admin console: http://localhost:8000/admin

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: fuelops, POSTGRES_PASSWORD: fuelops, POSTGRES_DB: fuelops }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuelops"]
      interval: 2s
      retries: 30

  migrate:
    <<: *backend
    command: ["migrate"]
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }

  ingestor:                                     # the ONLY service allowed to call the simulator
    <<: *backend
    command: ["ingestor"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8081"
      SIM_BASE_URL: http://simulator:8000
      SIM_MAX_INFLIGHT: "4"
    ports: ["8081:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      simulator: { condition: service_healthy }

  intel:
    <<: *backend
    command: ["intel"]
    environment: { <<: *backend-env, HTTP_ADDR: ":8082" }
    ports: ["8082:8082"]

  api:
    <<: *backend
    command: ["api"]
    environment: { <<: *backend-env, HTTP_ADDR: ":8080" }
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  pgdata:
